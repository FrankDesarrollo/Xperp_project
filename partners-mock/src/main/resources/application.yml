spring:
  application:
    name: xperp-partners-mock
  config:
    import: classpath:partners.yml
  threads:
    virtual:
      enabled: true
  jackson:
    property-naming-strategy: SNAKE_CASE
    default-property-inclusion: non_null
    time-zone: America/Bogota
    serialization:
      write-dates-as-timestamps: false

server:
  port: 8101

xperp:
  partners:
    api-token: ${PARTNERS_API_TOKEN}
    webhook-secret: ${WEBHOOK_SECRET}
    backend-url: ${BACKEND_URL:http://localhost:8080}
    random-seed: ${SIM_RANDOM_SEED:42}

logging:
  level:
    com.xperp.partners: INFO
