# Configuración base. Los valores salen de variables de entorno (ver .env.example).
# Nada de secretos en este archivo.
spring:
  application:
    name: xperp
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev,demo}
  threads:
    virtual:
      enabled: true

  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/xperp}
    username: ${POSTGRES_USER:xperp}
    password: ${POSTGRES_PASSWORD:xperp}

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate # el esquema lo manda Flyway
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
        timezone:
          default_storage: NORMALIZE_UTC

  flyway:
    enabled: true
    locations: classpath:db/migration

  jackson:
    property-naming-strategy: SNAKE_CASE
    default-property-inclusion: non_null
    time-zone: ${TZ:America/Bogota}
    serialization:
      write-dates-as-timestamps: false

  mail:
    host: ${MAIL_HOST:localhost}
    port: ${MAIL_PORT:1025}

  modulith:
    events:
      jdbc:
        schema-initialization:
          enabled: false # la tabla event_publication la crea una migración de Flyway
      republish-outstanding-events-on-restart: true

  # Proveedor de LLM: LLM_PROVIDER = mock | anthropic | openai | ollama.
  # Con "mock" ningún modelo de Spring AI se activa y se usa MockLlmGateway.
  ai:
    model:
      chat: ${LLM_PROVIDER:mock}
      embedding: none
      image: none
      moderation: none
      audio:
        speech: none
        transcription: none
    anthropic:
      api-key: ${LLM_API_KEY:}
      chat:
        options:
          model: ${LLM_MODEL:}
    openai:
      api-key: ${LLM_API_KEY:}
      chat:
        options:
          model: ${LLM_MODEL:}
    ollama:
      base-url: ${OLLAMA_BASE_URL:http://localhost:11434}
      chat:
        options:
          model: ${LLM_MODEL:}

server:
  port: 8080
  error:
    include-stacktrace: never

springdoc:
  swagger-ui:
    path: /swagger-ui.html

# Propiedades propias de Xperp. Cada bloque se enlaza con un @ConfigurationProperties en su módulo.
xperp:
  security:
    jwt-secret: ${JWT_SECRET}
    jwt-expires-minutes: ${JWT_EXPIRES_MINUTES:120}
  ai:
    max-llm-calls-per-sim-day: ${LLM_MAX_CALLS_PER_SIM_DAY:30}
    shadow-mode: ${AI_SHADOW_MODE:false}
  simulation:
    start-date: ${SIM_START_DATE:2026-11-01}
    seconds-per-day: ${SIM_SECONDS_PER_DAY:20}
    history-days: ${SIM_HISTORY_DAYS:90}
    random-seed: ${SIM_RANDOM_SEED:42}
    autostart: ${SIM_AUTOSTART:false}
    auto-approve: ${SIM_AUTO_APPROVE:false}
  partners:
    api-url: ${PARTNERS_API_URL:http://localhost:8101}
    api-token: ${PARTNERS_API_TOKEN}
    webhook-secret: ${WEBHOOK_SECRET}
