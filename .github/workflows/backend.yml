name: backend

on:
  pull_request:
    paths: ["backend/**", "contracts/**", ".github/workflows/backend.yml"]
  push:
    branches: [main]
    paths: ["backend/**", "contracts/**", ".github/workflows/backend.yml"]

jobs:
  verify:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      # Node.js para empaquetar el contrato con Redocly antes de generar código
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: maven
      # Compila contra el contrato, Spotless, pruebas unitarias,
      # de integración (Testcontainers) y ModularityTest.
      - name: Verify
        run: ./mvnw -B verify
