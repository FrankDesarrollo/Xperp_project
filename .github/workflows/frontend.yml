name: frontend

on:
  pull_request:
    paths: ["frontend/**", "contracts/**", ".github/workflows/frontend.yml"]
  push:
    branches: [main]
    paths: ["frontend/**", "contracts/**", ".github/workflows/frontend.yml"]

jobs:
  verify:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run gen:api
      - run: npm run check
      - run: npm run lint
      - run: npm run test
      - run: npm run build
