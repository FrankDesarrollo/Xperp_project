  # sales
  /customers:
    $ref: paths/sales.yaml#/customers
  /sales-orders:
    $ref: paths/sales.yaml#/sales-orders
  /sales-orders/{id}:
    $ref: paths/sales.yaml#/sales-order
  /sales-orders/{id}/cancel:
    $ref: paths/sales.yaml#/sales-order-cancel
  /sales-orders/{id}/release:
    $ref: paths/sales.yaml#/sales-order-release
  # purchasing
  /suppliers:
    $ref: paths/purchasing.yaml#/suppliers
  /suppliers/{id}/offers:
    $ref: paths/purchasing.yaml#/supplier-offers
  /supplier-offers:
    $ref: paths/purchasing.yaml#/product-offers
  /purchase-orders:
    $ref: paths/purchasing.yaml#/purchase-orders
  /purchase-orders/{id}:
    $ref: paths/purchasing.yaml#/purchase-order
  /purchase-orders/{id}/send:
    $ref: paths/purchasing.yaml#/purchase-order-send
  /purchase-orders/{id}/cancel:
    $ref: paths/purchasing.yaml#/purchase-order-cancel
  /purchase-orders/{id}/pdf:
    $ref: paths/purchasing.yaml#/purchase-order-pdf
  # logistics
  /warehouse-tasks:
    $ref: paths/logistics.yaml#/warehouse-tasks
  /warehouse-tasks/{id}/start:
    $ref: paths/logistics.yaml#/warehouse-task-start
  /warehouse-tasks/{id}/complete:
    $ref: paths/logistics.yaml#/warehouse-task-complete
  /carriers:
    $ref: paths/logistics.yaml#/carriers
  /shipments:
    $ref: paths/logistics.yaml#/shipments
  /shipments/{id}/label:
    $ref: paths/logistics.yaml#/shipment-label
  # finance
  /budgets:
    $ref: paths/finance.yaml#/budgets
  /accounts-payable:
    $ref: paths/finance.yaml#/accounts-payable
  # ai
  /ai/decisions:
    $ref: paths/ai.yaml#/decisions
  /ai/decisions/{id}:
    $ref: paths/ai.yaml#/decision
  /ai/decisions/{id}/revert:
    $ref: paths/ai.yaml#/decision-revert
  /approvals:
    $ref: paths/ai.yaml#/approvals
  /approvals/{id}/approve:
    $ref: paths/ai.yaml#/approval-approve
  /approvals/{id}/reject:
    $ref: paths/ai.yaml#/approval-reject
  /ai/policies:
    $ref: paths/ai.yaml#/policies
  /ai/settings:
    $ref: paths/ai.yaml#/settings
  /ai/alerts:
    $ref: paths/ai.yaml#/alerts
  /ai/alerts/{id}/read:
    $ref: paths/ai.yaml#/alert-read
  /ai/forecasts:
    $ref: paths/ai.yaml#/forecasts
  /ai/recommendations:
    $ref: paths/ai.yaml#/recommendations
  # assistant
  /assistant/messages:
    $ref: paths/assistant.yaml#/messages
  /assistant/conversations/{id}:
    $ref: paths/assistant.yaml#/conversation
  # dashboard
  /dashboard/kpis:
    $ref: paths/dashboard.yaml#/kpis
  /dashboard/series:
    $ref: paths/dashboard.yaml#/series
  # notifications y stream
  /notifications:
    $ref: paths/platform.yaml#/notifications
  /notifications/{id}/read:
    $ref: paths/platform.yaml#/notification-read
  /notifications/read-all:
    $ref: paths/platform.yaml#/notifications-read-all
  /stream:
    $ref: paths/platform.yaml#/stream
  # simulation
  /simulation/clock:
    $ref: paths/platform.yaml#/simulation-clock
  /simulation/start:
    $ref: paths/platform.yaml#/simulation-start
  /simulation/pause:
    $ref: paths/platform.yaml#/simulation-pause
  /simulation/speed:
    $ref: paths/platform.yaml#/simulation-speed
  /simulation/reset:
    $ref: paths/platform.yaml#/simulation-reset
  /simulation/advance:
    $ref: paths/platform.yaml#/simulation-advance
  /simulation/scenarios:
    $ref: paths/platform.yaml#/simulation-scenarios
  # webhooks
  /webhooks/suppliers:
    $ref: paths/platform.yaml#/webhook-suppliers
  /webhooks/carriers:
    $ref: paths/platform.yaml#/webhook-carriers

