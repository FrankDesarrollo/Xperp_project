# Contrato raíz de la API de Xperp. Referencia: AGENTS.md, sección 7.
# Cada módulo tiene su archivo en paths/ y schemas/ para no editar el mismo archivo a la vez.
# Un cambio de contrato va en su propio PR (contract/<modulo>-<descripcion>).
openapi: 3.1.0
info:
  title: Xperp API
  version: 0.2.0
  description: |
    API REST del ERP Xperp. Convenciones:
    - Recursos en plural y kebab-case; JSON en snake_case.
    - Paginación: `?page=1&size=20` → `{ items, total, page, size }`.
    - Errores: `{ code, message, details }` con el código HTTP correcto.
    - Fechas ISO 8601 con zona horaria. Montos como string decimal (`"125000.00"`).
servers:
  - url: http://localhost:8080/api/v1
    description: Desarrollo local
security:
  - bearerAuth: []
tags:
  - name: auth
    description: Autenticación, sesión, usuarios y empresa
  - name: catalog
    description: Categorías y productos
  - name: inventory
    description: Bodegas, existencias, kardex, conteos y traslados
  - name: sales
    description: Clientes y pedidos de venta
  - name: purchasing
    description: Proveedores, ofertas y órdenes de compra
  - name: logistics
    description: Tareas de bodega, transportadoras y envíos
  - name: finance
    description: Presupuestos y cuentas por pagar
  - name: ai
    description: Decisiones, aprobaciones, políticas, ajustes, alertas y pronósticos
  - name: assistant
    description: Chat de solo lectura
  - name: dashboard
    description: KPIs y series
  - name: notifications
    description: Notificaciones del usuario
  - name: stream
    description: Eventos en tiempo real (SSE)
  - name: simulation
    description: Reloj simulado y guion
  - name: webhooks
    description: Respuestas de proveedores y transportadoras simulados

