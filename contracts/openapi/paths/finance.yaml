budgets:
  get:
    tags: [finance]
    operationId: listBudgets
    summary: Presupuesto de compras por categoría
    parameters:
      - name: period
        in: query
        required: false
        description: YYYY-MM; por defecto, el mes simulado actual
        schema:
          type: string
          pattern: '^\d{4}-\d{2}$'
    responses:
      "200":
        description: Presupuestos
        content:
          application/json:
            schema:
              type: array
              items:
                $ref: ../schemas/finance.yaml#/Budget
      "401":
        $ref: ../schemas/common.yaml#/responses/Unauthorized

accounts-payable:
  get:
    tags: [finance]
    operationId: listAccountsPayable
    summary: Cuentas por pagar a proveedores
    parameters:
      - name: status
        in: query
        required: false
        schema:
          type: string
      - $ref: ../schemas/common.yaml#/parameters/Page
      - $ref: ../schemas/common.yaml#/parameters/Size
    responses:
      "200":
        description: Página de cuentas por pagar
        content:
          application/json:
            schema:
              $ref: ../schemas/finance.yaml#/AccountPayablePage
      "401":
        $ref: ../schemas/common.yaml#/responses/Unauthorized
