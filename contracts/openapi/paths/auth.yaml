login:
  post:
    tags: [auth]
    operationId: login
    summary: Inicia sesión y devuelve un JWT
    security: []
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: ../schemas/auth.yaml#/LoginRequest
    responses:
      "200":
        description: Sesión iniciada
        content:
          application/json:
            schema:
              $ref: ../schemas/auth.yaml#/LoginResponse
      "400":
        $ref: ../schemas/common.yaml#/responses/BadRequest
      "401":
        $ref: ../schemas/common.yaml#/responses/Unauthorized

me:
  get:
    tags: [auth]
    operationId: getCurrentUser
    summary: Devuelve el usuario de la sesión actual
    responses:
      "200":
        description: Usuario autenticado
        content:
          application/json:
            schema:
              $ref: ../schemas/auth.yaml#/CurrentUser
      "401":
        $ref: ../schemas/common.yaml#/responses/Unauthorized
