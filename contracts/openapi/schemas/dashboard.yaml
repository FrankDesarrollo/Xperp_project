# Tablero: KPIs y series (AGENTS.md, sección 9.5). Solo lectura.

CategoryDays:
  type: object
  required: [category_code, category_name, days]
  properties:
    category_code:
      type: string
    category_name:
      type: string
    days:
      type: number
      format: double

SupplierFulfillment:
  type: object
  required: [supplier_code, supplier_name, orders, on_time_rate]
  properties:
    supplier_code:
      type: string
    supplier_name:
      type: string
    orders:
      type: integer
    on_time_rate:
      type: number
      format: double

DecisionCounts:
  type: object
  required: [executed, pending_approval, suggested, blocked, approved, rejected]
  properties:
    executed:
      type: integer
    pending_approval:
      type: integer
    suggested:
      type: integer
    blocked:
      type: integer
    approved:
      type: integer
    rejected:
      type: integer

Kpis:
  type: object
  required: [from, to, sales_today, sales_period, orders_today, gross_margin, gross_margin_pct, service_level, lost_sales_units, lost_sales_amount, stockout_skus, low_stock_skus, open_purchase_orders, late_purchase_orders, purchases_period, budget_execution_pct, inventory_value, rotation, decisions, avg_approval_minutes, overcost_assumed, inventory_days_by_category, supplier_fulfillment]
  properties:
    from:
      type: string
      format: date
    to:
      type: string
      format: date
    sales_today:
      $ref: common.yaml#/Money
    sales_period:
      $ref: common.yaml#/Money
    orders_today:
      type: integer
    gross_margin:
      $ref: common.yaml#/Money
    gross_margin_pct:
      type: number
      format: double
    service_level:
      type: number
      format: double
      description: Unidades despachadas / pedidas, entre 0 y 1
    lost_sales_units:
      type: integer
    lost_sales_amount:
      $ref: common.yaml#/Money
    stockout_skus:
      type: integer
    low_stock_skus:
      type: integer
    open_purchase_orders:
      type: integer
    late_purchase_orders:
      type: integer
    purchases_period:
      $ref: common.yaml#/Money
    budget_execution_pct:
      type: number
      format: double
    inventory_value:
      $ref: common.yaml#/Money
    rotation:
      type: number
      format: double
      description: Costo de ventas del periodo / valor del inventario
    decisions:
      $ref: "#/DecisionCounts"
    avg_approval_minutes:
      type: [number, "null"]
      format: double
      description: Minutos simulados entre la solicitud y la resolución
    overcost_assumed:
      $ref: common.yaml#/Money
    inventory_days_by_category:
      type: array
      items:
        $ref: "#/CategoryDays"
    supplier_fulfillment:
      type: array
      items:
        $ref: "#/SupplierFulfillment"

Series:
  type: object
  required: [metric, points]
  properties:
    metric:
      type: string
    points:
      type: array
      items:
        $ref: ai.yaml#/SeriesPoint

BudgetProjection:
  type: object
  required: [category_id, category_code, category_name, amount, committed, spent, used_pct, projected_pct, projected_overrun]
  properties:
    category_id:
      type: integer
      format: int64
    category_code:
      type: string
    category_name:
      type: string
    amount:
      $ref: common.yaml#/Money
    committed:
      $ref: common.yaml#/Money
    spent:
      $ref: common.yaml#/Money
    used_pct:
      type: number
      format: double
      description: (comprometido + gastado) / presupuesto × 100
    projected_pct:
      type: number
      format: double
      description: Uso proyectado a fin de mes al ritmo de compra de los días transcurridos
    projected_overrun:
      $ref: common.yaml#/Money

FinanceOverview:
  type: object
  description: >-
    Cifras financieras del periodo. Las calcula el sistema con consultas, sin IA. Ingresos son las
    ventas de pedidos válidos; el modelo no tiene caja ni cartera de clientes.
  required: [from, to, days_elapsed, days_in_period, revenue, cost_of_sales, gross_margin, gross_margin_pct, freight, freight_pct, margin_after_freight, purchases_received, purchases_committed, lost_sales_amount, payables_open, payables_due_7d, payables_overdue, inventory_value, inventory_excess_value, slow_mover_value, budgets]
  properties:
    from:
      type: string
      format: date
    to:
      type: string
      format: date
    days_elapsed:
      type: integer
    days_in_period:
      type: integer
    revenue:
      $ref: common.yaml#/Money
    cost_of_sales:
      $ref: common.yaml#/Money
    gross_margin:
      $ref: common.yaml#/Money
    gross_margin_pct:
      type: number
      format: double
    freight:
      $ref: common.yaml#/Money
    freight_pct:
      type: number
      format: double
      description: Fletes / ingresos × 100
    margin_after_freight:
      $ref: common.yaml#/Money
    purchases_received:
      $ref: common.yaml#/Money
    purchases_committed:
      $ref: common.yaml#/Money
      description: OC enviadas que todavía no llegan
    lost_sales_amount:
      $ref: common.yaml#/Money
    payables_open:
      $ref: common.yaml#/Money
    payables_due_7d:
      $ref: common.yaml#/Money
    payables_overdue:
      $ref: common.yaml#/Money
    inventory_value:
      $ref: common.yaml#/Money
      description: Inventario a costo
    inventory_excess_value:
      $ref: common.yaml#/Money
      description: Valor a costo de las unidades por encima del tope de cada existencia
    slow_mover_value:
      $ref: common.yaml#/Money
      description: Valor a costo de las existencias con más de 60 días de cobertura
    budgets:
      type: array
      items:
        $ref: "#/BudgetProjection"
