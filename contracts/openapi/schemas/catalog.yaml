# Catálogo: categorías y productos (AGENTS.md, sección 6.2).

Category:
  type: object
  required: [id, code, name]
  properties:
    id:
      type: integer
      format: int64
    code:
      type: string
      examples: ["ABA"]
    name:
      type: string

Product:
  type: object
  required: [id, sku, name, category_id, category_code, unit, units_per_case, weight_kg, cost, price, perishable, is_active]
  properties:
    id:
      type: integer
      format: int64
    sku:
      type: string
      examples: ["ABA-001"]
    name:
      type: string
    category_id:
      type: integer
      format: int64
    category_code:
      type: string
    unit:
      type: string
      description: Unidad de venta
    units_per_case:
      type: integer
    weight_kg:
      type: number
      format: double
    cost:
      $ref: common.yaml#/Money
    price:
      $ref: common.yaml#/Money
    perishable:
      type: boolean
    shelf_life_days:
      type: [integer, "null"]
    is_active:
      type: boolean

ProductPage:
  type: object
  required: [items, total, page, size]
  properties:
    items:
      type: array
      items:
        $ref: "#/Product"
    total:
      type: integer
      format: int64
    page:
      type: integer
    size:
      type: integer

ProductInput:
  type: object
  required: [sku, name, category_id, units_per_case, weight_kg, cost, price]
  properties:
    sku:
      type: string
      pattern: '^[A-Z]{3}-\d{3}$'
    name:
      type: string
      minLength: 2
      maxLength: 200
    category_id:
      type: integer
      format: int64
    unit:
      type: string
      default: und
    units_per_case:
      type: integer
      minimum: 1
    weight_kg:
      type: number
      format: double
      minimum: 0
    cost:
      $ref: common.yaml#/Money
    price:
      $ref: common.yaml#/Money
    perishable:
      type: boolean
      default: false
    shelf_life_days:
      type: [integer, "null"]
    is_active:
      type: boolean
      default: true
