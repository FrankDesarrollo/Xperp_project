LoginRequest:
  type: object
  required: [email, password]
  properties:
    email:
      type: string
      format: email
    password:
      type: string
      minLength: 1

LoginResponse:
  type: object
  required: [access_token, token_type, expires_in, user]
  properties:
    access_token:
      type: string
    token_type:
      type: string
      const: Bearer
    expires_in:
      type: integer
      description: Segundos hasta que vence el token
    user:
      $ref: "#/CurrentUser"

Role:
  type: string
  enum: [admin, manager, purchasing, warehouse, viewer]

CurrentUser:
  type: object
  required: [id, email, full_name, role, company_id]
  properties:
    id:
      type: integer
      format: int64
    email:
      type: string
      format: email
    full_name:
      type: string
    role:
      $ref: "#/Role"
    company_id:
      type: integer
      format: int64
    warehouse_id:
      type: [integer, "null"]
      format: int64
