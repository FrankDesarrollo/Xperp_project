# Compras: proveedores, ofertas, órdenes de compra y recepciones (AGENTS.md, sección 6.5).

SupplierLeadTime:
  type: object
  required: [warehouse_id, warehouse_code, lead_time_days]
  properties:
    warehouse_id:
      type: integer
      format: int64
    warehouse_code:
      type: string
    lead_time_days:
      type: integer

Supplier:
  type: object
  required: [id, code, name, nit, city, email, min_order_amount, payment_terms_days, on_time_rate, fill_rate, is_active, lead_times, offer_count]
  properties:
    id:
      type: integer
      format: int64
    code:
      type: string
      examples: ["PRV-01"]
    name:
      type: string
    nit:
      type: string
    city:
      type: string
    email:
      type: string
    min_order_amount:
      $ref: common.yaml#/Money
    payment_terms_days:
      type: integer
      description: 0 es contado
    on_time_rate:
      type: number
      format: double
    fill_rate:
      type: number
      format: double
    is_active:
      type: boolean
    lead_times:
      type: array
      items:
        $ref: "#/SupplierLeadTime"
    offer_count:
      type: integer

SupplierOffer:
  type: object
  required: [supplier_id, supplier_code, supplier_name, product_id, sku, product_name, category_code, unit_cost, list_cost, min_order_cases, units_per_case, is_preferred]
  properties:
    supplier_id:
      type: integer
      format: int64
    supplier_code:
      type: string
    supplier_name:
      type: string
    product_id:
      type: integer
      format: int64
    sku:
      type: string
    product_name:
      type: string
    category_code:
      type: string
    unit_cost:
      $ref: common.yaml#/Money
    list_cost:
      $ref: common.yaml#/Money
    min_order_cases:
      type: integer
    units_per_case:
      type: integer
    is_preferred:
      type: boolean
    price_updated_at:
      type: [string, "null"]
      format: date-time

PurchaseOrderItem:
  type: object
  required: [id, product_id, sku, product_name, quantity, quantity_received, unit_cost, line_total]
  properties:
    id:
      type: integer
      format: int64
    product_id:
      type: integer
      format: int64
    sku:
      type: string
    product_name:
      type: string
    quantity:
      type: integer
    quantity_received:
      type: integer
    unit_cost:
      $ref: common.yaml#/Money
    line_total:
      $ref: common.yaml#/Money

PurchaseOrderEvent:
  type: object
  required: [status, occurred_at]
  properties:
    status:
      type: string
    note:
      type: [string, "null"]
    occurred_at:
      type: string
      format: date-time

PurchaseOrder:
  type: object
  required: [id, number, supplier_id, supplier_code, supplier_name, warehouse_id, warehouse_code, status, subtotal, total, created_at, created_by_ai]
  properties:
    id:
      type: integer
      format: int64
    number:
      type: string
      examples: ["OC-2026-000001"]
    supplier_id:
      type: integer
      format: int64
    supplier_code:
      type: string
    supplier_name:
      type: string
    warehouse_id:
      type: integer
      format: int64
    warehouse_code:
      type: string
    status:
      type: string
      description: "draft, pending_approval, sent, confirmed, delayed, rejected, shipped, received, cancelled"
    status_reason:
      type: [string, "null"]
    subtotal:
      $ref: common.yaml#/Money
    total:
      $ref: common.yaml#/Money
    expected_at:
      type: [string, "null"]
      format: date-time
    sent_at:
      type: [string, "null"]
      format: date-time
    confirmed_at:
      type: [string, "null"]
      format: date-time
    received_at:
      type: [string, "null"]
      format: date-time
    created_at:
      type: string
      format: date-time
    created_by_ai:
      type: boolean
    created_by_user_id:
      type: [integer, "null"]
      format: int64
    created_by_name:
      type: [string, "null"]
    ai_decision_id:
      type: [integer, "null"]
      format: int64
    replaces_po_id:
      type: [integer, "null"]
      format: int64
    replaces_po_number:
      type: [string, "null"]
    external_id:
      type: [string, "null"]
    items:
      type: array
      items:
        $ref: "#/PurchaseOrderItem"
    events:
      type: array
      items:
        $ref: "#/PurchaseOrderEvent"

PurchaseOrderPage:
  type: object
  required: [items, total, page, size]
  properties:
    items:
      type: array
      items:
        $ref: "#/PurchaseOrder"
    total:
      type: integer
      format: int64
    page:
      type: integer
    size:
      type: integer

PurchaseOrderLine:
  type: object
  required: [product_id, quantity]
  properties:
    product_id:
      type: integer
      format: int64
    quantity:
      type: integer
      minimum: 1

PurchaseOrderRequest:
  type: object
  required: [supplier_id, warehouse_id, items]
  properties:
    supplier_id:
      type: integer
      format: int64
    warehouse_id:
      type: integer
      format: int64
    items:
      type: array
      minItems: 1
      items:
        $ref: "#/PurchaseOrderLine"
    send:
      type: boolean
      default: false
      description: Si es true, la OC se envía al proveedor al crearla
