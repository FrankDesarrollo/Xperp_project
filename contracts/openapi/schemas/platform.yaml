# Notificaciones, simulación y webhooks (AGENTS.md, secciones 6.8, 7.3 y 10).

Notification:
  type: object
  required: [id, type, title, body, created_at]
  properties:
    id:
      type: integer
      format: int64
    type:
      type: string
    title:
      type: string
    body:
      type: string
    link:
      type: [string, "null"]
    read_at:
      type: [string, "null"]
      format: date-time
    created_at:
      type: string
      format: date-time

NotificationPage:
  type: object
  required: [items, total, page, size, unread]
  properties:
    items:
      type: array
      items:
        $ref: "#/Notification"
    total:
      type: integer
      format: int64
    page:
      type: integer
    size:
      type: integer
    unread:
      type: integer
      format: int64

SimulationClock:
  type: object
  required: [sim_time, status, seconds_per_day, day_number, scenario_cursor, scenarios_total, ai_mode]
  properties:
    sim_time:
      type: string
      format: date-time
    status:
      type: string
      description: "paused, running"
    seconds_per_day:
      type: integer
    day_number:
      type: integer
      description: Día de la simulación (1 = SIM_START_DATE)
    scenario_cursor:
      type: integer
    scenarios_total:
      type: integer
    ai_mode:
      type: string
      description: "active, shadow, stopped"

SimulationSpeedRequest:
  type: object
  required: [seconds_per_day]
  properties:
    seconds_per_day:
      type: integer
      minimum: 2
      maximum: 3600

Scenario:
  type: object
  required: [index, day, time, type, title, expected, done]
  properties:
    index:
      type: integer
    day:
      type: integer
    time:
      type: string
      examples: ["08:00"]
    type:
      type: string
    title:
      type: string
    expected:
      type: string
    done:
      type: boolean

SupplierWebhookItem:
  type: object
  required: [sku, quantity]
  properties:
    sku:
      type: string
    quantity:
      type: integer

SupplierWebhook:
  type: object
  required: [external_id, po_number, status]
  properties:
    external_id:
      type: string
    po_number:
      type: string
    status:
      type: string
      description: "confirmed, rejected, delayed, shipped, delivered"
    expected_at:
      type: [string, "null"]
      format: date-time
    reason:
      type: [string, "null"]
    items:
      type: array
      items:
        $ref: "#/SupplierWebhookItem"

CarrierWebhook:
  type: object
  required: [tracking_number, status, occurred_at]
  properties:
    tracking_number:
      type: string
    status:
      type: string
      description: "in_transit, delivered, failed"
    occurred_at:
      type: string
      format: date-time
